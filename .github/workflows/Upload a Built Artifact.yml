name: Build and Upload Artifact

# Trigger on push to main
on:
  push:
    branches: ["main"]

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Bun (Required for your project)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # 3. Install Dependencies
      - name: Install Dependencies
        run: bun install

      # 4. Build the Project
      - name: Build
        run: bun run build

      # 5. Upload the Build Artifact (The part you were trying to add)
      # We place it here, inside the 'steps' list
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/  # OR .next/ OR build/ (Depending on what your build script outputs)
          retention-days: 5